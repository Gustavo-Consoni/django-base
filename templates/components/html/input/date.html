<c-vars class label description name errors variable required />

<div
    x-data="{
        open: false,
        datePickerMonth: '',
        datePickerYear: '',
        datePickerDay: '',
        datePickerDaysInMonth: [],
        datePickerBlankDaysInMonth: [],
        datePickerMonthNames: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'],
        datePickerDays: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'],
        datePickerDayClicked(day) {
            let selectedDate = new Date(this.datePickerYear, this.datePickerMonth, day)
            this.datePickerDay = day
            {{ variable }} = this.datePickerFormatDate(selectedDate)
            this.datePickerIsSelectedDate(day)
            this.open = false
        },
        datePickerPreviousMonth() {
            if (this.datePickerMonth == 0) {
                this.datePickerYear--
                this.datePickerMonth = 12
            }
            this.datePickerMonth--
            this.datePickerCalculateDays()
        },
        datePickerNextMonth() {
            if (this.datePickerMonth == 11) {
                this.datePickerMonth = 0
                this.datePickerYear++
            } else {
                this.datePickerMonth++
            }
            this.datePickerCalculateDays()
        },
        datePickerIsSelectedDate(day) {
            const d = new Date(this.datePickerYear, this.datePickerMonth, day)
            return {{ variable }} == this.datePickerFormatDate(d) ? true : false
        },
        datePickerIsToday(day) {
            const today = new Date()
            const d = new Date(this.datePickerYear, this.datePickerMonth, day)
            return today.toDateString() == d.toDateString() ? true : false
        },
        datePickerCalculateDays() {
            let daysInMonth = new Date(this.datePickerYear, this.datePickerMonth + 1, 0).getDate()
            let dayOfWeek = new Date(this.datePickerYear, this.datePickerMonth).getDay()
            let blankdaysArray = []
            for (var i = 1; i <= dayOfWeek; i++) {
                blankdaysArray.push(i)
            }
            let daysArray = []
            for (var i = 1; i <= daysInMonth; i++) {
                daysArray.push(i)
            }
            this.datePickerBlankDaysInMonth = blankdaysArray
            this.datePickerDaysInMonth = daysArray
        },
        datePickerFormatDate(date) {
            let formattedDate = ('0' + date.getDate()).slice(-2)
            let formattedMonth = ('0' + (parseInt(date.getMonth()) + 1)).slice(-2)
            let formattedYear = date.getFullYear()
            return `${formattedDate}/${formattedMonth}/${formattedYear}`
        },
    }"
    x-init="
        currentDate = new Date()
        if ({{ variable }}) {
            currentDate = new Date(Date.parse({{ variable }}))
        }
        datePickerMonth = currentDate.getMonth()
        datePickerYear = currentDate.getFullYear()
        datePickerDay = currentDate.getDay()
        datePickerCalculateDays()
    "
    class="{{ class }} space-y-2"
>
    {% if label %}
        <p class="font-medium text-white text-sm">{{ label }}</p>
    {% endif %}

    {% if description %}
        <p class="text-gray-300 text-xs">{{ description }}</p>
    {% endif %}

    <div class="relative text-gray-300 text-sm">
        <div class="absolute inset-0 cursor-pointer" @click="open = !open"></div>
        <div :class="{ 'border-blue-600': open }" class="flex items-center gap-2 p-2 border border-[#323232] rounded-sm duration-300">
            <input
                class="outline-none w-full"
                x-model="{{ variable }}"
                type="text"
                {% if required %} required {% endif %}
            >
            <c-icon.solid.20.calendar-days class="shrink-0"></c-icon.solid.20.calendar-days>
        </div>
        <div
            class="top-12 left-0 z-10 absolute space-y-8 bg-[#101010] p-4 border border-[#323232] rounded-sm w-full"
            @click.outside="open = false"
            x-show="open"
            x-transition
            x-cloak
        >
            <div class="flex justify-between items-center mx-2">
                <div class="space-x-2 text-white text-lg">
                    <span class="font-bold" x-text="datePickerMonthNames[datePickerMonth]"></span>
                    <span>-</span>
                    <span x-text="datePickerYear"></span>
                </div>
                <div class="flex items-center gap-2">
                    <button
                        class="hover:bg-[#323232] p-1 rounded-full text-white duration-300 cursor-pointer"
                        @click="datePickerPreviousMonth()"
                        type="button"
                    >
                        <c-icon.solid.24.chevron-left class="mr-0.5"></c-icon.solid.24.chevron-left>
                    </button>
                    <button
                        class="hover:bg-[#323232] p-1 rounded-full text-white duration-300 cursor-pointer"
                        @click="datePickerNextMonth()"
                        type="button"
                    >
                        <c-icon.solid.24.chevron-right class="ml-0.5"></c-icon.solid.24.chevron-right>
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-7">
                <template x-for="day in datePickerDays">
                    <div class="font-medium text-gray-300 text-xs text-center" x-text="day"></div>
                </template>
            </div>
            <div class="grid grid-cols-7">
                <template x-for="blankDay in datePickerBlankDaysInMonth">
                    <div class="p-1"></div>
                </template>
                <template x-for="day in datePickerDaysInMonth">
                    <div class="flex justify-center items-center aspect-square">
                        <div
                            :class="{ 'bg-[#323232] text-white': datePickerIsSelectedDate(day) == true }"
                            class="flex justify-center items-center hover:bg-[#323232] rounded-full size-7 text-gray-300 hover:text-white text-sm text-center duration-300 cursor-pointer"
                            @click="datePickerDayClicked(day)"
                            x-text="day"
                        ></div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    {% if errors %}
        <template x-for="error in {{ errors }}">
            <p class="text-red-500 text-xs" x-text="error"></p>
        </template>
    {% endif %}
</div>
